[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Settings modules use `from .base import *` on purpose; test settings set env vars before importing base.
"config/settings/*.py" = ["F403", "F405", "E402"]
"config/settings/test.py" = ["S105", "S106"]
"**/tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser journeys (Playwright), run with `pytest -m e2e`"]
