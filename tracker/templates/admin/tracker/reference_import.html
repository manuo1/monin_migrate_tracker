{% extends "admin/base_site.html" %}
{% load i18n %}
{% block content %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <p>{% translate "One value per line (first column). Duplicates and values already present are ignored." %}</p>
  <input type="submit" value="{% translate 'Import' %}" class="default">
</form>
{% endblock %}
